            .join("");
      }

      function locationRowHtml(loc) {
        const field = (name, value, label, extra = "") =>
          `<input data-field="${name}" value="${esc(String(value))}" aria-label="${label}" placeholder="${label}" autocomplete="off" spellcheck="false" ${extra}>`;
        return `<div class="location-row">
      <span class="legend-dot"></span>
      ${field("name", loc.name, "Name")}
      ${field("lat", loc.lat, "Latitude", 'inputmode="decimal"')}
      ${field("lng", loc.lng, "Longitude", 'inputmode="decimal"')}
      ${field("timezone", loc.timezone, "Timezone", 'list="timezoneOptions"')}
      <button class="location-remove" type="button" data-remove-location aria-label="Remove location" title="Remove location">&times;</button>
    </div>`;
      }

      // Row order determines display colors, so recolor after adds and removals.
      function updateLocationRowColors() {
        locationRows
          .querySelectorAll(".location-row .legend-dot")
          .forEach((dot, i) => {
            dot.style.background = colorFor(i);
          });
      }

      function fillLocationEditor(list) {
        locationRows.innerHTML = list.map(locationRowHtml).join("");
        locationError.textContent = "";
        locationResetPending = false;
        updateLocationRowColors();
      }

      function openLocationEditor(opener) {
        closeDetails();
        hideCalendarTooltip();
        locationNote.innerHTML =
          locationsFromQuery() !== null
            ? "Locations are currently read from the URL. Applying updates the URL, so you can bookmark or share it."
            : "Showing the built-in presets. Applying stores the locations in the URL as <code>?loc=Name,lat,lng,Timezone</code>, so you can bookmark or share it.";
        fillLocationEditor(locations);
        locationReturnFocus = opener;
        showOverlay(locationOverlay);
        (locationRows.querySelector("input") || locationAdd).focus();
      }

      function closeLocationEditor() {
        if (locationOverlay.hidden) return;
        const returnFocus = locationReturnFocus;
        locationReturnFocus = null;
        hideOverlay(
          locationOverlay,
          returnFocus,
          document.getElementById("legendEdit"),
        );
      }

      // Marks invalid fields and focuses the first one with an error.
      function readLocationEditor() {
        let firstError = null;
        const list = [...locationRows.querySelectorAll(".location-row")].map(
          (row, i) => {
            const input = (field) =>
              row.querySelector(`[data-field="${field}"]`);
            const loc = {
              name: input("name").value.trim(),
              lat: parseNumber(input("lat").value),
              lng: parseNumber(input("lng").value),
              timezone: input("timezone").value.trim(),
            };
            let failed = null;
            for (const rule of LOCATION_RULES) {
              const valid = rule.isValid(loc);
              input(rule.field).setAttribute("aria-invalid", String(!valid));
              if (!valid && !failed) failed = rule;
            }
            if (failed && !firstError) {
              firstError = `Location ${i + 1}: ${failed.message}`;
              input(failed.field).focus();
            }
            return loc;
          },
        );
        if (!firstError && !list.length)
          firstError = "Add at least one location.";
        return { list, error: firstError };
      }

      locationForm.addEventListener("submit", (e) => {
        e.preventDefault();
        const { list, error } = readLocationEditor();
        locationError.textContent = error || "";
        if (error) return;
        closeLocationEditor();
        setLocationsQuery(locationResetPending ? [] : list);
      });

      locationRows.addEventListener("click", (e) => {
        const remove = e.target.closest("[data-remove-location]");
        if (!remove) return;
        const row = remove.closest(".location-row");
        const next = row.nextElementSibling || row.previousElementSibling;
        row.remove();
        locationResetPending = false;
        updateLocationRowColors();
        (next?.querySelector("input") || locationAdd).focus();
      });

      locationRows.addEventListener("input", (e) => {
        e.target.removeAttribute("aria-invalid");
        locationResetPending = false;
      });

      locationAdd.addEventListener("click", () => {
        locationRows.insertAdjacentHTML(
          "beforeend",
          locationRowHtml({ name: "", lat: "", lng: "", timezone: "" }),
        );
        locationResetPending = false;
        updateLocationRowColors();
        locationRows.lastElementChild.querySelector("input").focus();
      });

      document.getElementById("locationReset").addEventListener("click", () => {
        fillLocationEditor(PRESET_LOCATIONS);
        locationResetPending = true;
      });

      document
        .getElementById("locationCancel")
        .addEventListener("click", closeLocationEditor);
      document
        .getElementById("locationClose")
        .addEventListener("click", closeLocationEditor);
      locationOverlay.addEventListener("click", (e) => {
        if (e.target === locationOverlay) closeLocationEditor();
      });

      legendEl.addEventListener("click", (e) => {
        const button = e.target.closest("#legendEdit");
        if (button) openLocationEditor(button);
      });

      // ═══════════════════════════════════════════════════════════════
      // Locations
      // ═══════════════════════════════════════════════════════════════

      // Presets are used only when the URL has no `loc` parameters.
      const PRESET_LOCATIONS = [
        {
          name: "New York",
          lat: 40.71,
          lng: -74,
          timezone: "America/New_York",
        },
        {
          name: "Los Angeles",
          lat: 34.0522,
          lng: -118.2437,
          timezone: "America/Los_Angeles",
        },
        {
          name: "London",
          lat: 51.5074,
          lng: -0.1278,
          timezone: "Europe/London",
        },
        { name: "Paris", lat: 48.8566, lng: 2.3522, timezone: "Europe/Paris" },
        { name: "Tokyo", lat: 35.6762, lng: 139.6503, timezone: "Asia/Tokyo" },
        {
          name: "Sydney",
          lat: -33.8688,
          lng: 151.2093,
          timezone: "Australia/Sydney",
        },
        {
          name: "Reykjavik",
          lat: 64.1355,
          lng: -21.8954,
          timezone: "Atlantic/Reykjavik",
        },
        { name: "Dubai", lat: 25.2048, lng: 55.2708, timezone: "Asia/Dubai" },
      ];

      loadLocations();
      render();
    </script>
  </body>
</html>
